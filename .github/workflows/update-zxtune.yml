name: Update ZXTune and publish bottles

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: Build bottles for the formula's current version, even if upstream has not changed
        type: boolean
        default: false
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      update: ${{ steps.update.outputs.update }}
      version: ${{ steps.update.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream tag and update formula
        id: update
        shell: bash
        env:
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -euo pipefail

          upstream="https://github.com/vitamin-caig/zxtune.git"
          latest_tag="$(git ls-remote --tags --refs "$upstream" 'refs/tags/r*' \
            | sed -E 's#.*refs/tags/(r[0-9]+)$#\1#' \
            | sort -V \
            | tail -n 1)"

          if [[ ! "$latest_tag" =~ ^r[0-9]+$ ]]; then
            echo "Could not determine the latest upstream ZXTune tag" >&2
            exit 1
          fi

          current_version="$(sed -nE 's/^  version "(r[0-9]+)"$/\1/p' Formula/zxtune123.rb)"
          if [[ "$latest_tag" == "$current_version" && "$FORCE_BUILD" != "true" ]]; then
            echo "No upstream update: $current_version"
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "version=$current_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          url="https://github.com/vitamin-caig/zxtune/archive/refs/tags/${latest_tag}.tar.gz"
          sha256="$(curl --fail --location --silent --show-error "$url" | sha256sum | awk '{print $1}')"

          ruby - "$latest_tag" "$url" "$sha256" Formula/zxtune123.rb <<'RUBY'
          version, url, sha256, path = ARGV
          formula = File.read(path)
          replacements = [
            ["url", /^  url \".*\"$/, "  url \"#{url}\""],
            ["version", /^  version \"r[0-9]+\"$/, "  version \"#{version}\""],
            ["sha256", /^  sha256 \"[0-9a-f]{64}\"$/, "  sha256 \"#{sha256}\""]
          ]
          replacements.each do |name, pattern, replacement|
            abort "Could not update #{name} in #{path}" unless formula.sub!(pattern, replacement)
          end
          abort "Could not update root.version in #{path}" unless formula.gsub!(/\"root\.version=r[0-9]+\"/, "\"root.version=#{version}\"")
          formula.sub!(/^  bottle do\n.*?^  end\n\n/m, "")
          File.write(path, formula)
          RUBY

          echo "update=true" >> "$GITHUB_OUTPUT"
          echo "version=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Upload updated formula
        if: steps.update.outputs.update == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updated-formula
          path: Formula/zxtune123.rb

  build-bottles:
    needs: prepare
    if: needs.prepare.outputs.update == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: arm64-sequoia
          - runner: macos-15-intel
            platform: x86_64-sequoia
          - runner: macos-26
            platform: arm64-tahoe
          - runner: macos-26-intel
            platform: x86_64-tahoe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Download updated formula
        uses: actions/download-artifact@v4
        with:
          name: updated-formula
          path: Formula

      - name: Build and bottle formula
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          brew tap anteo/zxtune
          tap_path="$(brew --repository anteo/zxtune)"
          cp Formula/zxtune123.rb "$tap_path/Formula/zxtune123.rb"
          brew install --build-bottle --formula --verbose anteo/zxtune/zxtune123
          brew bottle --json \
            --root-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/zxtune123-${VERSION}" \
            anteo/zxtune/zxtune123

      - name: Upload bottle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bottles-${{ matrix.platform }}
          path: |
            *.bottle.json
            *.bottle*.tar.gz

  publish:
    needs: [prepare, build-bottles]
    if: needs.prepare.outputs.update == 'true' && needs.build-bottles.result == 'success'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Download updated formula
        uses: actions/download-artifact@v4
        with:
          name: updated-formula
          path: Formula

      - name: Download bottle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bottles-*
          path: bottles
          merge-multiple: true

      - name: Merge bottle metadata into formula
        run: |
          set -euo pipefail
          brew tap anteo/zxtune
          brew trust anteo/zxtune
          tap_path="$(brew --repository anteo/zxtune)"
          cp Formula/zxtune123.rb "$tap_path/Formula/zxtune123.rb"
          for bottle_json in bottles/*.bottle.json; do
            brew bottle --merge --write --no-commit --no-all-checks "$bottle_json"
          done
          cp "$tap_path/Formula/zxtune123.rb" Formula/zxtune123.rb

      - name: Publish bottle release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          release_tag="zxtune123-${VERSION}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" bottles/*.bottle*.tar.gz \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$release_tag" bottles/*.bottle*.tar.gz \
              --title "$release_tag" \
              --notes "Homebrew bottles for zxtune123 ${VERSION}." \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Create formula update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          branch="automation/zxtune123-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add Formula/zxtune123.rb
          if git diff --cached --quiet; then
            echo "Formula is already up to date"
            exit 0
          fi
          git commit -m "chore(zxtune123): update to ${VERSION}"
          git push --force origin "$branch"

          if ! gh pr view "$branch" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          Updates zxtune123 to ${VERSION} and publishes bottles for Apple Silicon and Intel on macOS 15 and 26.

          The workflow built each bottle from the updated formula.
          EOF
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "chore(zxtune123): update to ${VERSION}" \
              --body-file "$RUNNER_TEMP/pr-body.md"
          fi
